# MkDocs configuration for ComfyUI-MSS-Login documentation
# Build: mkdocs build | Serve locally: mkdocs serve
site_name: ComfyUI MSS Login
site_description: The next-generation security, governance, permissions, and multi-user control system for ComfyUI.
site_url: https://mss-login.monsterspawned.studio/
repo_url: https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login
repo_name: ComfyUI-MSS-Login
edit_uri: edit/production/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.tabs.link
    - content.code.copy

nav:
  - Home: index.md
  - Guide:
      - Installation: guide/installation.md
      - Configuration: guide/configuration.md
      - Secrets and database: guide/secrets-and-database.md
      - Authentication: guide/authentication.md
      - Image generation pipeline: guide/image-generation.md
      - Headless JWT session: guide/headless-jwt-session.md
      - NSFW and outputs: guide/nsfw-and-outputs.md
      - Model isolation: guide/model-isolation.md
      - Model download API: guide/model-download-api.md
      - S3 storage: guide/s3-storage.md
      - Extending the node: guide/extending.md
  - Experimental Settings:
      - Overview: experimental/index.md
      - MFA: experimental/mfa.md
      - S3: experimental/s3.md
      - Loading screen: experimental/loading-screen.md
      - News: experimental/news.md
      - Model isolation: experimental/model-isolation.md
      - Tailscale local auth: experimental/tailscale-local-auth.md
      - Install other node deps: experimental/install-other-nodes-deps.md
      - Failsafe: experimental/failsafe.md
  - Integrations:
      - Mobile and Comfy Portal: integrations/comfy-portal.md
  - API Reference:
      - HTTP Endpoints: api-reference/endpoints.md
      - Workflow & intercepted: api-reference/workflow-endpoints.md
      - ComfyUI client APIs: api-reference/comfyui-client-endpoints.md
  - Extension API:
      - NSFW Guard API: extension-api/nsfw-guard-api.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - toc:
      permalink: true
