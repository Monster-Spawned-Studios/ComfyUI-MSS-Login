# Code quality: lint (Ruff) and optional format check.
# Configure [tool.ruff] in pyproject.toml to tune rules.
name: Code quality

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  ruff:
    name: Ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github ."
          src: "."
          version: "latest"

  ruff-format:
    name: Ruff (format check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."
          src: "."
          version: "latest"

  copyright:
    name: Copyright headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check copyright headers
        run: python scripts/add_copyright.py --check
