# Reusable ntfy notification workflow (GitHub).
#
# Call from the same repository:
#   uses: ./.github/workflows/ntfy-notify-reusable.yml
#
# Required secrets (pass with `secrets: inherit` or map explicitly):
#   NTFY_URL, NTFY_TOPIC; optional NTFY_TOKEN
#
# Optional attachment: upload an Actions artifact in a prior job, then pass
# attachment_artifact (exact name) and/or attachment_pattern (glob). The notify
# job downloads it and PUTs the file to ntfy. Missing artifacts fall back to
# text-only notify (never fails the notification job solely for that).
name: Notify via ntfy

on:
  workflow_call:
    inputs:
      title:
        description: "Notification title (ntfy Title header)"
        required: true
        type: string
      message:
        description: "Notification body / message text"
        required: true
        type: string
      priority:
        description: "ntfy priority 1–5 (default 3; use 5 for failures)"
        required: false
        type: string
        default: "3"
      tags:
        description: "Comma-separated ntfy tags (emoji keywords)"
        required: false
        type: string
        default: ""
      ref_name:
        description: "Optional branch/tag/ref label appended in the body"
        required: false
        type: string
        default: ""
      skip_if_unconfigured:
        description: "Exit successfully when NTFY_URL/NTFY_TOPIC are missing"
        required: false
        type: boolean
        default: true
      attachment_artifact:
        description: "Exact Actions artifact name to download and attach"
        required: false
        type: string
        default: ""
      attachment_pattern:
        description: "Optional artifact name glob (used when exact name is empty)"
        required: false
        type: string
        default: ""
      attachment_filename:
        description: "Preferred filename when zipping multi-file downloads"
        required: false
        type: string
        default: "ci-report.zip"
    secrets:
      NTFY_URL:
        description: "ntfy server base URL"
        required: false
      NTFY_TOPIC:
        description: "ntfy topic"
        required: false
      NTFY_TOKEN:
        description: "Optional Bearer token for authenticated topics"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Send ntfy notification
    runs-on: ubuntu-latest
    steps:
      - name: Download attachment artifact (by name)
        id: download_named
        if: ${{ inputs.attachment_artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.attachment_artifact }}
          path: ntfy-attachment
          merge-multiple: false

      - name: Download attachment artifact (by pattern)
        id: download_pattern
        if: ${{ inputs.attachment_artifact == '' && inputs.attachment_pattern != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.attachment_pattern }}
          path: ntfy-attachment
          merge-multiple: true

      - name: Publish to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          PRIORITY: ${{ inputs.priority }}
          TAGS: ${{ inputs.tags }}
          REF_NAME: ${{ inputs.ref_name }}
          SKIP_IF_UNCONFIGURED: ${{ inputs.skip_if_unconfigured }}
          WANT_ARTIFACT: ${{ inputs.attachment_artifact || inputs.attachment_pattern }}
          PREFERRED_ZIP_NAME: ${{ inputs.attachment_filename }}
          DOWNLOAD_NAMED: ${{ steps.download_named.outcome }}
          DOWNLOAD_PATTERN: ${{ steps.download_pattern.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NTFY_URL:-}" ] || [ -z "${NTFY_TOPIC:-}" ]; then
            if [ "${SKIP_IF_UNCONFIGURED}" = "true" ]; then
              echo "NTFY_URL/NTFY_TOPIC not configured; skipping notification."
              exit 0
            fi
            echo "NTFY_URL and NTFY_TOPIC are required."
            exit 1
          fi

          finished=$(date '+%m/%d/%Y %I:%M %p')
          body="${MESSAGE}"
          if [ -n "${REF_NAME:-}" ]; then
            body=$(printf '%s\n\nRef: `%s`\nFinished: %s\n' "$MESSAGE" "$REF_NAME" "$finished")
          else
            body=$(printf '%s\n\nFinished: %s\n' "$MESSAGE" "$finished")
          fi
          header_message=$(printf '%s' "$body" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-900)

          attachment=""
          attachment_name=""
          if [ -n "${WANT_ARTIFACT:-}" ] && [ -d ntfy-attachment ]; then
            mapfile -t files < <(find ntfy-attachment -type f | sort)
            if [ "${#files[@]}" -eq 1 ]; then
              attachment="${files[0]}"
              attachment_name="$(basename "$attachment")"
            elif [ "${#files[@]}" -gt 1 ]; then
              mkdir -p ntfy-out
              attachment="ntfy-out/${PREFERRED_ZIP_NAME:-ci-report.zip}"
              if command -v zip >/dev/null 2>&1; then
                (cd ntfy-attachment && zip -qr "../${attachment}" .)
              else
                attachment="ntfy-out/ci-report.tar.gz"
                tar -C ntfy-attachment -czf "${attachment}" .
              fi
              attachment_name="$(basename "$attachment")"
            fi
          fi

          args=(-H "Title: ${TITLE}" -H "Priority: ${PRIORITY}")
          if [ -n "${TAGS:-}" ]; then
            args+=(-H "Tags: ${TAGS}")
          fi
          if [ -n "${NTFY_TOKEN:-}" ]; then
            args+=(-H "Authorization: Bearer ${NTFY_TOKEN}")
          fi

          url="${NTFY_URL%/}/${NTFY_TOPIC}"
          if [ -n "${attachment}" ] && [ -f "${attachment}" ]; then
            # ntfy PUT can fail on size limits; fall back to text-only.
            set +e
            curl -fsS -X PUT "${args[@]}" \
              -H "Filename: ${attachment_name}" \
              -H "Message: ${header_message}" \
              -T "${attachment}" \
              "${url}"
            put_status=$?
            set -e
            if [ "$put_status" -eq 0 ]; then
              echo "ntfy notification sent with attachment: ${attachment_name}"
              exit 0
            fi
            echo "ntfy attachment upload failed (exit ${put_status}); sending text-only."
          else
            if [ -n "${WANT_ARTIFACT:-}" ]; then
              echo "Attachment unavailable (named=${DOWNLOAD_NAMED:-n/a} pattern=${DOWNLOAD_PATTERN:-n/a}); text-only."
            fi
          fi

          curl -fsS "${args[@]}" -d "${body}" "${url}"
          echo "ntfy notification sent."
