name: Publish to ComfyUI registry
on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - "pyproject.toml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: "publish"
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to ComfyUI registry
    runs-on: ubuntu-latest
    env:
      NODE_PATH: ${{ github.workspace }}
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: uv sync --group comfyui
      - name: Publish ComfyUI Node
        run: uv run scripts/publish_comfy_node.py
