name: Publish to ComfyUI registry
on:
    workflow_dispatch:
    push:
        branches:
            - "release/*"

permissions:
    contents: read
    packages: write
    id-token: write

concurrency:
    group: "publish"
    cancel-in-progress: true

jobs:
    publish:
        name: Publish to ComfyUI registry
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  path: ${{ github.workspace }}/ComfyUI-MSS-Login
                  lfs: true
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: ComfyUI-MSS-Login/pyproject.toml
            - name: Validate release branch
              if: github.event_name == 'push'
              run: |
                  if [[ ! "${GITHUB_REF_NAME}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Publish pushes must target release/X.Y.Z branches. Got: ${GITHUB_REF_NAME}"
                      exit 1
                  fi
                  echo "Release branch OK: ${GITHUB_REF_NAME}"
            - name: Verify pyproject version matches release branch
              if: github.event_name == 'push'
              working-directory: ComfyUI-MSS-Login
              run: |
                  set -euo pipefail
                  BRANCH_VERSION="${GITHUB_REF_NAME#release/}"
                  PYPROJECT_VERSION="$(python3 scripts/release_prepare.py --print-version)"
                  if [ "$PYPROJECT_VERSION" != "$BRANCH_VERSION" ]; then
                      echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match release branch ($BRANCH_VERSION)."
                      exit 1
                  fi
                  echo "Version OK: $PYPROJECT_VERSION"
            - name: Install uv
              run: pip install -U uv
            - run: uv sync --group comfyui
              working-directory: ComfyUI-MSS-Login
            - name: Publish ComfyUI Node
              working-directory: ${{ github.workspace }}/ComfyUI-MSS-Login
              env:
                  NODE_PATH: ${{ github.workspace }}/ComfyUI-MSS-Login
                  COMFY_NODE_NAME: MSS-Login
                  REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
              run: uv run scripts/publish_comfy_node.py -D -v --node-name "${COMFY_NODE_NAME}" --node-path "${NODE_PATH}"
