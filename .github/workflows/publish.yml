name: Publish to ComfyUI registry
on:
    workflow_dispatch:
    push:
        branches:
            - production
        paths:
            - "pyproject.toml"

jobs:
    publish:
        name: Publish to ComfyUI registry
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Run Publish Script
              run: |
                  chmod +x .github/scripts/publish-comfy-node.sh; \
                  sh .github/scripts/publish-comfy-node.sh
              env:
                  REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
