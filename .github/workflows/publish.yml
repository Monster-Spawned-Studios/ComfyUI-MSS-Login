name: Publish to ComfyUI registry
on:
    workflow_dispatch:
    push:
        branches:
            - production
        paths:
            - "pyproject.toml"

permissions:
    contents: read
    packages: write
    id-token: write

concurrency:
    group: "publish"
    cancel-in-progress: true

jobs:
    publish:
        name: Publish to ComfyUI registry
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  path: ${{ github.workspace }}/ComfyUI-MSS-Login
                  lfs: true
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: pyproject.toml
            - run: uv sync --group comfyui
            - name: Publish ComfyUI Node
              run: uv run scripts/publish_comfy_node.py -t ${{ secrets.REGISTRY_ACCESS_TOKEN }} -p ${{ github.workspace }}/ComfyUI-MSS-Login -D -v
              env:
                  NODE_PATH: ${{ github.workspace }}
                  REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
