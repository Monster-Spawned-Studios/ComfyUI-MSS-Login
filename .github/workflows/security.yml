# Security: secrets scan (Gitleaks) and dependency vulnerability scan (pip-audit).
# Do not disable; keeps credentials and known-vuln deps out of the repo.
name: Security scan

on:
    push:
        branches: [development, production, release/*]
    pull_request:
        branches: [development, production, release/*]
    schedule:
        - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

jobs:
    secrets:
        name: Secrets scan (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (full history for push)
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    dependencies:
        name: Dependency audit (pip-audit)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Install pip-audit
              run: |
                  pip install pip-audit
            - name: Run pip-audit
              run: pip-audit -r requirements.txt -r requirements_cuda.txt -r requirements_metal.txt
