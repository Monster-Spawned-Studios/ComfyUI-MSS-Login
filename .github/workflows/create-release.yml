name: Create Release

on:
  push:
    branches:
      - release/*
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.X.X). Leave empty to auto-increment patch from latest tag"
        required: false
        default: ""
      changelog_title:
        description: "Changelog title suffix (optional; default from latest commit subject)"
        required: false
        default: ""
      changelog_notes:
        description: "Additional changelog notes (markdown, appended after auto-generated bullets)"
        required: false
        default: ""
      pre-release:
        description: "Whether to create a pre-release"
        required: false
        default: "false"
      draft:
        description: "Whether to create a draft release"
        required: false
        default: "false"

permissions:
  contents: write
  discussions: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve and prepare version
        id: version
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Extract inputs
            V="${{ inputs.version }}"
            # Remove whitespace
            V="${V// /}"
            if [ -n "$V" ]; then
              ARGS+=(--version "$V")
            fi
            
            TITLE="${{ inputs.changelog_title }}"
            if [ -n "${TITLE// /}" ]; then
              ARGS+=(--changelog-title "$TITLE")
            fi
            
            NOTES="${{ inputs.changelog_notes }}"
            if [ -n "$NOTES" ]; then
              ARGS+=(--changelog-notes "$NOTES")
            fi
          else
            # Push to release/*: use branch name e.g. release/1.2.3 -> 1.2.3
            VERSION_NAME="${GITHUB_REF_NAME#release/}"
            ARGS+=(--version "$VERSION_NAME")
          fi
          
          python3 scripts/release_prepare.py "${ARGS[@]}"

      - name: Commit and push release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/${VERSION}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git checkout -b "$BRANCH"
          fi

          git add pyproject.toml README.md readme/CHANGES.md "readme/changelogs/${VERSION}.md"
          if git diff --staged --quiet; then
            echo "No release file changes to commit."
          else
            git commit -m "chore(release): prepare v${VERSION}"
          fi

          git push -u origin "$BRANCH"

      - name: Compress Node Files
        run: |
          V="${{ steps.version.outputs.version }}"
          zip -r "MSS-Login-v${V}.zip" readme/*.md "readme/changelogs/${V}.md" routes scripts users web utils __init__.py .env.example api.py config.default.json constants.py globals.py mss_login.py nodes.py pyproject.toml requirements.txt requirements_cuda.txt requirements_metal.txt README.md

      - name: Test Changelog
        run: cat "readme/changelogs/${{ steps.version.outputs.version }}.md"

      - name: Check if release tag exists
        id: tag_check
        run: |
          V="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/${V}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${V} already exists; skipping GitHub release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.tag_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            readme/changelogs/${{ steps.version.outputs.version }}.md
            MSS-Login-v${{ steps.version.outputs.version }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Release v${{ steps.version.outputs.version }}"
          tag_name: "${{ steps.version.outputs.version }}"
          make_latest: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.pre-release || false }}
          body_path: readme/changelogs/${{ steps.version.outputs.version }}.md
