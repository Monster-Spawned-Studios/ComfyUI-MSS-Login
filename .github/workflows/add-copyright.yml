# Add copyright headers to the project
name: Add copyright headers

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

permissions:
  contents: write
  pull-requests: write

jobs:
  add-copyright-dry-run:
    name: Add copyright headers
    runs-on: [self-hosted, win11]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check copyright headers
        run: python scripts/add_copyright.py --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  add-copyright:
    name: Add copyright headers
    runs-on: [self-hosted, win11]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Add copyright headers
        run: python scripts/add_copyright.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
