# Pull request manager: label by changed files and optional PR checks.
name: Pull request manager

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Label PR based on changed files
        uses: actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

  pr-check:
    name: PR description check
    if: ${{ github.event.pull_request.user.type != 'Bot' && !endsWith(github.event.pull_request.user.login, '[bot]') && !contains(fromJSON('["dependabot","copilot","claude","cursor","github-actions"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body="${PR_BODY}"
          if [ -z "${body// }" ]; then
            echo "::warning::Pull request has no description. Consider adding a summary."
            exit 0
          fi
          echo "PR has description."
