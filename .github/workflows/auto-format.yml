# Auto-format Python files with ruff and commit the result.
# Triggers on pushes to development / production and on PRs targeting them.
name: Auto-format (ruff)

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

permissions:
  contents: write

jobs:
  format-check:
    name: Format check (dry-run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
          src: "."
          version: "latest"

      - name: Run Ruff lint check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"
          src: "."
          version: "latest"

  auto-format:
    name: Auto-format and commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"
          src: "."
          version: "latest"
        continue-on-error: true

      - name: Run Ruff lint fix
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix"
          src: "."
          version: "latest"
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "style: auto-format with ruff"
            git push
          fi
