# Require non-empty PR description (project-wide "no blank PRs").
# Fails if the PR body is missing, too short, or does not use a template section.
# To enforce project-wide: Settings → Branches → Branch protection → Require status checks → add "PR body check" or "PR description required".
name: PR body check

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [development, production]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-body:
    name: PR description required
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user || {};
            const login = (author.login || '').toLowerCase();
            const authorType = (author.type || '').toLowerCase();
            const knownBotPrefixes = ['dependabot', 'copilot', 'claude', 'cursor', 'github-actions'];
            const isBot =
              authorType === 'bot' ||
              login.endsWith('[bot]') ||
              login.endsWith('-bot') ||
              knownBotPrefixes.some((prefix) => login === prefix || login.startsWith(`${prefix}-`));
            if (isBot) {
              console.log(`Skipping PR body and template checks for bot author: ${author.login || 'unknown'}`);
              return;
            }

            const body = pr.body || '';
            const stripped = body.replace(/\s/g, '').replace(/<!--[\s\S]*?-->/g, '');
            const minLength = 80;
            const hasTemplateSection = /##\s*(Description|Type of change|Bug|Scope|Behavior|Checklist)/i.test(body);
            if (stripped.length < minLength) {
              core.setFailed(
                'PR description is required and must be at least ' + minLength + ' non-whitespace characters. ' +
                'Please use one of the templates (General, Bug fix, Feature, Documentation, Config/tooling) and fill it in.'
              );
            }
            if (!hasTemplateSection) {
              core.setFailed(
                'PR description must use one of the repository templates (General, Bug fix, Feature, Documentation, Config/tooling). ' +
                'Use the template links in the default description or add a "## Description" (or similar) section.'
              );
            }
            console.log('PR body length (after stripping):', stripped.length);
