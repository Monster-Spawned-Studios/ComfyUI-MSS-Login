# PR template config — platform support
#
# GitHub: Does NOT support config.yml in PULL_REQUEST_TEMPLATE/. Only issue
#         templates use config (e.g. .github/ISSUE_TEMPLATE/config.yml with
#         blank_issues_enabled). Blank PRs are enforced via the "PR body check"
#         workflow and optional branch protection.
#
# Gitea:  Supports ISSUE_TEMPLATE/config.yml (blank_issues_enabled, contact_links).
#         No documented config for PULL_REQUEST_TEMPLATE or blank_pull_request_enabled.
#
# GitLab: Uses .gitlab/merge_request_templates/ (not .github/). No config file
#         in that folder for disabling blank merge requests.
#
# Do not add keys like blank_pull_request_enabled here; they are ignored on all
# three platforms. Keep this file as documentation only, or remove it.
