# Labels applied to PRs based on changed files.
# Used by .github/workflows/pull-request.yml (actions/labeler).
# https://github.com/actions/labeler

documentation:
    - changed-files:
          - any: ["**/*.md", "**/README*", "**/docs/**", "**/readme/**"]

python:
    - changed-files:
          - any: ["**/*.py", "pyproject.toml", "**/requirements*.txt"]

frontend:
    - changed-files:
          - any: ["web/**/*.js", "web/**/*.css", "web/**/*.html"]

config:
    - changed-files:
          - any: ["config.json", ".env.example", "**/defaults/**"]

ci:
    - changed-files:
          - any: [".github/**", ".gitlab/**", ".gitea/**", "scripts/**"]

agent:
    - changed-files:
          - any: [".agent/**", ".gemini/**", ".cursor/**", ".claude/**"]

vscode:
    - changed-files:
          - any: [".vscode/**"]

docker:
    - changed-files:
          - any: ["docker/**"]

docker-compose:
    - changed-files:
          - any: ["docker-compose.yml"]

web:
    - changed-files:
          - any: ["web/**"]

gitignore:
    - changed-files:
          - any: [".gitignore"]

license:
    - changed-files:
          - any: ["**/LICENSE*", "**/license*"]

security:
    - changed-files:
          - any:
                [
                    "**/security/**",
                    "**/auth*.py",
                    "**/jwt*.py",
                    "**/access_control*.py",
                    "**/ip_filter*.py",
                    "**/timeout*.py",
                    "**/logger*.py",
                    "**/sanitizer*.py",
                    "**/install_deps*.py",
                    "**/sqlite_connection*.py",
                    "**/migrate_api_tokens_to_unified*.py",
                    "**/model_cache*.py",
                    "**/shared_items_store*.py",
                    "**/api_token_store*.py",
                    "**/users_db*.py",
                    "**/mfa_temp_store*.py",
                    "**/encryption*.py",
                    "**/db_key_derivation*.py",
                    "**/watcher*.py",
                    "**/api*.py",
                ]

docs:
    - changed-files:
          - any: ["docs/**"]

workflows:
    - changed-files:
          - any: [".github/workflows/**"]

issue-template:
    - changed-files:
          - any: [".github/ISSUE_TEMPLATE/**"]

pull-request-template:
    - changed-files:
          - any: [".github/PULL_REQUEST_TEMPLATE/**"]

changelog:
    - changed-files:
          - any: ["readme/changelogs/*.md"]

contributor-addition:
    - changed-files:
          - any:
                [
                    ".github/CODEOWNERS",
                    ".github/funding.yml",
                    ".github/config.yml",
                ]
