<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)">

    <title>MSS-Login - Login</title>

    <link rel="icon" href="/mss-login/assets/mss_logo.png" type="image/png">

    <!-- Light mode favicon -->
    <link rel="icon" type="image/png"
        href="/mss-login/assets/mss_logo.png"
        media="(prefers-color-scheme: light)">

    <!-- Dark mode favicon -->
    <link rel="icon" type="image/png"
        href="/mss-login/assets/mss_logo.png"
        media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" type="text/css" href="/mss-login/css/styles.css">
    <style>
        .login-news { margin-top: 1.5rem; border-top: 1px solid #3f3f46; padding-top: 1rem; }
        .login-news h2 { font-size: 0.95rem; margin-bottom: 0.5rem; color: #a1a1aa; }
        .login-news-feed { max-height: 120px; overflow-y: auto; font-size: 0.85rem; color: #71717a; }
        .login-news-item { margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #27272a; }
        .login-news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .login-news-item strong { color: #a1a1aa; }
        .login-news-item time { font-size: 0.8rem; }
    </style>
</head>

<body>
    <div class="container">
        <picture>
            <!-- Dark mode logo -->
            <source srcset="/mss-login/assets/mss_logo.png"
                    media="(prefers-color-scheme: dark)">
            <!-- Light mode logo -->
            <source srcset="/mss-login/assets/mss_logo.png"
                    media="(prefers-color-scheme: light)">
            <img class="logo"
                src="/mss-login/assets/mss_logo.png"
                alt="MSS-Login Logo">
        </picture>
        <h1 class="title login">Login</h1>
        <!-- method="post" and action prevent credentials from ever being sent in the URL (e.g. if JS is disabled). -->
        <form id="login-form" method="post" action="/login" onsubmit="login(event)">
            <div class="form-field">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-field">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-field">
                <a href="/mss-login/generate_token">Get API Token</a>
            </div>
            <div class="form-field">
                <a href="/register">Register a New User</a>
            </div>

            <!-- Main login + guest login -->
            <div class="form-field" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button class="btn" type="submit">Login</button>
                <button class="btn" type="button" onclick="guestLogin(event)">Guest Login</button>
            </div>

            <!-- hidden flag used for guest login -->
            <input type="hidden" id="guest_login_flag" name="guest_login" value="false">
            <!-- Version info -->
            <div>
                <p class="version-info" style="margin-top:1rem; font-size:0.9rem; color: #888888; text-align:center;">
                MSS-Login - v1.8.1</p>
            </div>
        </form>
        <!-- Experimental: server news feed (RSS from data dir news.md) -->
        <div id="login-news-section" class="login-news" style="display: none;">
            <h2>Server news</h2>
            <div id="login-news-feed" class="login-news-feed"></div>
        </div>
    </div>
    <div class="toast-container" id="toasts"></div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"></script>
<script src="/mss-login/js/auth.js"></script>
<script>
(function () {
    var section = document.getElementById("login-news-section");
    var feedEl = document.getElementById("login-news-feed");
    if (!section || !feedEl) return;
    fetch("/mss-login/api/news/feed.xml", { credentials: "same-origin" })
        .then(function (r) {
            if (!r.ok) return null;
            return r.text();
        })
        .then(function (xmlText) {
            if (!xmlText) return;
            var parser = new DOMParser();
            var doc = parser.parseFromString(xmlText, "text/xml");
            var items = doc.querySelectorAll("channel > item");
            if (!items.length) return;
            feedEl.innerHTML = "";
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var title = (item.querySelector("title") && item.querySelector("title").textContent) || "";
                var desc = (item.querySelector("description") && item.querySelector("description").textContent) || "";
                var pubDate = (item.querySelector("pubDate") && item.querySelector("pubDate").textContent) || "";
                var div = document.createElement("div");
                div.className = "login-news-item";
                var strong = document.createElement("strong");
                strong.textContent = title;
                var timeEl = document.createElement("time");
                timeEl.textContent = pubDate ? " " + pubDate : "";
                div.appendChild(strong);
                div.appendChild(timeEl);
                if (desc) {
                    var p = document.createElement("p");
                    p.style.margin = "0.25rem 0 0 0";
                    p.textContent = desc;
                    div.appendChild(p);
                }
                feedEl.appendChild(div);
            }
            section.style.display = "block";
        })
        .catch(function () {});
})();
</script>

</html>
