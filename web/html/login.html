<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)">

    <title>MSS-Login - Login</title>

    <link rel="icon" href="/mss-login/assets/mss_logo.png" type="image/png">

    <!-- Light mode favicon -->
    <link rel="icon" type="image/png"
        href="/mss-login/assets/mss_logo.png"
        media="(prefers-color-scheme: light)">

    <!-- Dark mode favicon -->
    <link rel="icon" type="image/png"
        href="/mss-login/assets/mss_logo.png"
        media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" type="text/css" href="/mss-login/css/styles.css">
    <link rel="stylesheet" type="text/css" href="/mss-login/dist/auth.css">
    <style>
        .login-news { margin-top: 1.5rem; border-top: 1px solid #3f3f46; padding-top: 1rem; }
        .login-news h2 { font-size: 0.95rem; margin-bottom: 0.5rem; color: #a1a1aa; }
        .login-news-feed { max-height: 120px; overflow-y: auto; font-size: 0.85rem; color: #71717a; }
        .login-news-item { margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #27272a; }
        .login-news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .login-news-item strong { color: #a1a1aa; }
        .login-news-item time { font-size: 0.8rem; }
    </style>
</head>

<body>
    <div id="mss-login-auth-app"></div>
    <div class="container mss-auth-shell">
        <picture>
            <!-- Dark mode logo -->
            <source srcset="/mss-login/assets/mss_logo.png"
                    media="(prefers-color-scheme: dark)">
            <!-- Light mode logo -->
            <source srcset="/mss-login/assets/mss_logo.png"
                    media="(prefers-color-scheme: light)">
            <img class="logo"
                src="/mss-login/assets/mss_logo.png"
                alt="MSS-Login Logo">
        </picture>
        <h1 class="title login mss-auth-title">Login</h1>
        <!-- method="post" and action prevent credentials from ever being sent in the URL (e.g. if JS is disabled). -->
        <form id="login-form" method="post" action="/login">
            <div class="form-field mss-auth-field">
                <label class="mss-auth-label" for="username">Username:</label>
                <input class="mss-auth-input" type="text" id="username" name="username" required>
            </div>
            <div class="form-field mss-auth-field">
                <label class="mss-auth-label" for="password">Password:</label>
                <input class="mss-auth-input" type="password" id="password" name="password" required>
            </div>
            <!-- Main login + guest login -->
            <div class="form-field" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button class="btn mss-auth-btn" type="submit">Login</button>
                <button class="btn mss-auth-btn" type="button" id="guest-login-btn">Guest Login</button>
            </div>

            <!-- hidden flag used for guest login -->
            <input type="hidden" id="guest_login_flag" name="guest_login" value="false">
            <!-- Version info -->
            <div>
                <p class="version-info" id="login-version" style="margin-top:1rem; font-size:0.9rem; color: #888888; text-align:center;">
                MSS-Login - v{{VERSION}}</p>
            </div>
        </form>
        <!-- Experimental: server news feed (RSS from data dir news.md) -->
        <div id="login-news-section" class="login-news" style="display: none;">
            <h2>Server news</h2>
            <div id="login-news-feed" class="login-news-feed"></div>
        </div>
    </div>
    <div class="toast-container" id="toasts"></div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"></script>
<script src="/mss-login/js/auth.js"></script>
<script type="module" src="/mss-login/dist/auth-app.js"></script>
</html>
