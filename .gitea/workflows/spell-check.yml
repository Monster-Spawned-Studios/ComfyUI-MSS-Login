# Spell-check documentation and code comments (codespell).
# See: https://github.com/codespell-project/actions-codespell
name: Spell check

on:
    push:
        branches: [development, production]
    pull_request:
        branches: [development, production]

jobs:
    codespell:
        name: Codespell
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Pnpm
              uses: pnpm/action-setup@v6
              with:
                version: latest
                cache: true                  
            - name: Install cSpell
              run: pnpm add -g cspell@latest
            - name: Run cSpell
              run: cspell --config .vscode/cspell.json "**/*"
