# Spell-check documentation and code comments (cspell).
# Gitea-compatible: no actions/upload-artifact — attach the report to ntfy in-job.
name: Spell check

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  cspell:
    name: Spell check (cspell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install cspell
        run: npm install -g cspell@latest

      - name: Verify dictionaries
        shell: bash
        run: |
          set -euo pipefail
          test -f .vscode/cspell.json
          test -f .vscode/dictionaries/mss-login.txt
          test -f .vscode/dictionaries/comfyui.txt
          test -f .vscode/dictionaries/monsterspawnedstudios.txt
          echo "cspell config and dictionaries present."

      - name: Run cspell
        id: cspell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          report="ci-reports/cspell-report.txt"
          {
            echo "MSS-Login cspell report"
            echo "======================"
            echo "Ref: ${GITHUB_REF_NAME:-unknown}"
            echo "SHA: ${GITHUB_SHA:-unknown}"
            echo "Event: ${GITHUB_EVENT_NAME:-unknown}"
            echo
          } > "${report}"

          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1 || true
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null || true)
          else
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT HEAD~1...HEAD 2>/dev/null || true)
          fi

          if [ "${#changed[@]}" -gt 0 ]; then
            echo "Checking ${#changed[@]} changed file(s)." | tee -a "${report}"
            set +e
            cspell --config .vscode/cspell.json --no-progress --show-context --no-must-find-files "${changed[@]}" >> "${report}" 2>&1
            status=$?
            set -e
          else
            echo "No changed-file list; scanning project files from cspell config." | tee -a "${report}"
            set +e
            cspell --config .vscode/cspell.json --no-progress --show-context "**/*" >> "${report}" 2>&1
            status=$?
            set -e
          fi

          echo >> "${report}"
          if [ "$status" -eq 0 ]; then
            echo "Result: PASS (no spelling issues)." | tee -a "${report}"
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "Result: ISSUES FOUND (exit ${status})." | tee -a "${report}"
            echo "outcome=issues" >> "$GITHUB_OUTPUT"
          fi
          # Config/tool failures are hard errors; spelling findings stay soft.
          if [ "$status" -gt 1 ]; then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          exit 0

      - name: Notify via ntfy (with report attachment)
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          CSPELL_OUTCOME: ${{ steps.cspell.outputs.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcome="${CSPELL_OUTCOME:-unknown}"
          if [ "$outcome" = "success" ]; then
            export TITLE="MSS-Login Spell Check — Passed"
            export PRIORITY="3"
            export TAGS="white_check_mark,abc"
          else
            export TITLE="MSS-Login Spell Check — Issues found"
            export PRIORITY="5"
            export TAGS="warning,abc"
          fi
          export MESSAGE="$(printf '=== Spell check (cspell) ===\nResult: %s\nReport: attached cspell-report.txt\n' "$outcome")"
          export ATTACHMENT_PATH="ci-reports/cspell-report.txt"
          export ATTACHMENT_FILENAME="cspell-report.txt"
          export SKIP_IF_UNCONFIGURED="true"
          bash scripts/ci/ntfy_publish.sh
