# Security: secrets scan (Gitleaks), dependency audit (pip-audit), and OSV scan.
# Gitea-compatible variant: OSV uses the CLI (Google's reusable workflows are GitHub-only).
# Do not disable; keeps credentials and known-vuln deps out of the repo.
name: Security scan

on:
  push:
    branches: [development, production, release/*]
  pull_request:
    branches: [development, production, release/*]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  secrets:
    name: Secrets scan (Gitleaks)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (full history for push)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install and Run Gitleaks
        shell: python
        run: |
          import os, urllib.request, json, sys, platform, subprocess, tarfile, zipfile

          dl_os = {'linux': 'linux', 'darwin': 'darwin', 'windows': 'windows'}.get(platform.system().lower(), 'linux')
          machine = platform.machine().lower()
          dl_arch = 'arm64' if machine in ('arm64', 'aarch64') else 'x64'
          ext = 'zip' if dl_os == 'windows' else 'tar.gz'
          target = f"{dl_os}_{dl_arch}.{ext}"

          url = "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          req = urllib.request.urlopen(url)
          assets = json.loads(req.read().decode())['assets']
          dl_url = next(a['browser_download_url'] for a in assets if target in a['name'])

          print(f"Downloading {dl_url}")
          archive, _ = urllib.request.urlretrieve(dl_url)

          if ext == 'zip':
              with zipfile.ZipFile(archive, 'r') as z:
                  z.extractall(".")
          else:
              with tarfile.open(archive, 'r:gz') as t:
                  t.extractall(".")

          bin_name = "gitleaks.exe" if dl_os == 'windows' else "gitleaks"
          bin_path = os.path.abspath(bin_name)
          if dl_os != 'windows':
              os.chmod(bin_path, 0o755)

          sys.exit(subprocess.call([bin_path, "detect", "--source", ".", "-v"]))

  dependencies:
    name: Dependency audit (pip-audit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install audit tooling
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cu128

  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
      - name: Run OSV-Scanner
        run: osv-scanner --recursive --skip-git .

  ntfy-notification:
    name: Notify on Security Scan Results
    needs: [secrets, dependencies, osv-scan]
    if: always()
    uses: ./.gitea/workflows/ntfy-notify-reusable.yml
    with:
      title: ${{ (needs.secrets.result == 'success' && needs.dependencies.result == 'success' && needs.osv-scan.result == 'success') && 'MSS-Login Security — All checks passed' || 'MSS-Login Security — Issues found' }}
      message: |
        === Secrets scan (Gitleaks) ===
        Result: ${{ needs.secrets.result }}

        === Dependency audit (pip-audit) ===
        Result: ${{ needs.dependencies.result }}

        === OSV Vulnerability Scan ===
        Result: ${{ needs.osv-scan.result }}
      priority: ${{ (needs.secrets.result == 'success' && needs.dependencies.result == 'success' && needs.osv-scan.result == 'success') && '3' || '5' }}
      tags: ${{ (needs.secrets.result == 'success' && needs.dependencies.result == 'success' && needs.osv-scan.result == 'success') && 'white_check_mark,lock' || 'warning,lock' }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
