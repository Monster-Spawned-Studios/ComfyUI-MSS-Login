# Security: secrets scan (Gitleaks), dependency audit (pip-audit), and OSV scan.
# Gitea-compatible variant: OSV uses the CLI (Google's reusable workflows are GitHub-only).
# Do not disable; keeps credentials and known-vuln deps out of the repo.
name: Security scan

on:
  push:
    branches: [development, production, release/*]
  pull_request:
    branches: [development, production, release/*]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  secrets:
    name: Secrets scan (Gitleaks)
    # History scan is OS-independent; ubuntu avoids Windows/macOS download edge cases.
    runs-on: ubuntu-latest
    env:
      # Pin the release asset URL (no api.github.com — avoids runner rate limits).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_BIN_DIR: ${{ github.workspace }}/.ci-bin
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks (pinned release asset)
        shell: bash
        run: bash scripts/ci/install-gitleaks.sh
      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          "${GITLEAKS_BIN_DIR}/gitleaks" detect --source . -v

  dependencies:
    name: Dependency audit (pip-audit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install audit tooling
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cu128

  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
      - name: Run OSV-Scanner
        run: osv-scanner --recursive --skip-git .

  ntfy-notification:
    name: Notify on Security Scan Results
    needs: [secrets, dependencies, osv-scan]
    if: always()
    uses: ./.gitea/workflows/ntfy-notify-reusable.yml
    with:
      title: ${{ (needs.secrets.result == 'success' && needs.dependencies.result == 'success' && needs.osv-scan.result == 'success') && 'MSS-Login Security — All checks passed' || 'MSS-Login Security — Issues found' }}
      message: |
        === Secrets scan (Gitleaks) ===
        Result: ${{ needs.secrets.result }}

        === Dependency audit (pip-audit) ===
        Result: ${{ needs.dependencies.result }}

        === OSV Vulnerability Scan ===
        Result: ${{ needs.osv-scan.result }}
      priority: ${{ (needs.secrets.result == 'success' && needs.dependencies.result == 'success' && needs.osv-scan.result == 'success') && '3' || '5' }}
      tags: ${{ (needs.secrets.result == 'success' && needs.dependencies.result == 'success' && needs.osv-scan.result == 'success') && 'white_check_mark,lock' || 'warning,lock' }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
