# Add copyright headers to the project
name: Add copyright headers

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

permissions:
  contents: write
  pull-requests: write

jobs:
  add-copyright-headers:
    name: Add copyright headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Add copyright headers
        run: python scripts/add_copyright.py --directory . --copyright-notice docs/COPYRIGHT --recursive --update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ntfy-notification:
    name: Notify on MSS-Login Copyright Results
    needs: [add-copyright-headers]
    if: always()
    uses: ./.gitea/workflows/ntfy-notify-reusable.yml
    with:
      title: ${{ (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) && 'MSS-Login Copyright — Succeeded' || 'MSS-Login Copyright — Failed' }}
      message: |
        === Add Copyright Headers ===
        Result: ${{ needs.add-copyright-headers.result }}
      priority: ${{ (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) && '3' || '5' }}
      tags: ${{ (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) && 'white_check_mark,copyright' || 'warning,copyright' }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
