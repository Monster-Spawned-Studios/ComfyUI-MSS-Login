# Production Docker Compose for ComfyUI with MSS-Login
# Supports NVIDIA Container Toolkit GPU acceleration and persistent storage.

services:
  comfyui:
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu124}
    container_name: comfyui-mss-login
    restart: unless-stopped
    ports:
      - "${PORT:-8188}:8188"
    environment:
      # MSS-Login Security and Configuration
      - HOST_BASE_URL=${HOST_BASE_URL:-http://localhost:8188}
      - SECRET_KEY=${SECRET_KEY:-}
      - MSS_LOGIN_DATA_DIR=/data/mss-login
      - CPE_EMBEDDED_CONVERT=${CPE_EMBEDDED_CONVERT:-true}
      - EXPERIMENTAL_LOGIN_BACKGROUND=${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
      - PYTHONUNBUFFERED=1
      # CLI Args for ComfyUI
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      # Persistent MSS-Login database, secrets, backgrounds, and user configs
      - mss_data:/data/mss-login
      # ComfyUI core assets
      - comfy_models:/root/ComfyUI/models
      - comfy_output:/root/ComfyUI/output
      - comfy_input:/root/ComfyUI/input
      - comfy_user:/root/ComfyUI/user
      # Mount MSS-Login into custom_nodes (if deploying locally)
      - ..:/root/ComfyUI/custom_nodes/ComfyUI-MSS-Login:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/mss-login/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mss_data:
    driver: local
    name: comfyui_mss_data
  comfy_models:
    driver: local
    name: comfyui_models
  comfy_output:
    driver: local
    name: comfyui_output
  comfy_input:
    driver: local
    name: comfyui_input
  comfy_user:
    driver: local
    name: comfyui_user
