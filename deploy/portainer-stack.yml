# Portainer Stack Definition for ComfyUI with MSS-Login
# Compatible with Portainer Web UI Stack Editor (Standalone Docker and Swarm)
#
# Environment variables configurable in Portainer UI:
# - HOST_BASE_URL: Public URL of your ComfyUI instance (e.g. https://ai.example.com)
# - SECRET_KEY: 32+ character random secret string for JWT and SQLCipher encryption
# - PORT: Host port mapping (default: 8188)
# - COMFYUI_IMAGE: Docker image to run (default: yanwk/comfyui-boot:cu124)
# - CPE_EMBEDDED_CONVERT: Enable embedded headless graph parser & browser pool for Comfy Portal & mobile apps (true/false)

version: "3.8"

services:
  comfyui:
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu126-slim}
    container_name: comfyui-mss-login
    restart: unless-stopped
    ports:
      - "${PORT:-8188}:8188"
    environment:
      - HOST_BASE_URL=${HOST_BASE_URL:-http://localhost:8188}
      - SECRET_KEY=${SECRET_KEY:-}
      - MSS_LOGIN_DATA_DIR=/data/mss-login
      - CPE_EMBEDDED_CONVERT=${CPE_EMBEDDED_CONVERT:-true}
      - EXPERIMENTAL_LOGIN_BACKGROUND=${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-}
      - PYTHONUNBUFFERED=1
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      - mss_login_data:/data/mss-login
      - comfyui_models:/root/ComfyUI/models
      - comfyui_output:/root/ComfyUI/output
      - comfyui_input:/root/ComfyUI/input
      - comfyui_user:/root/ComfyUI/user
      - comfyui_custom_nodes:/root/ComfyUI/custom_nodes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - "io.portainer.accesscontrol.public=true"
      - "com.docker.compose.project=comfyui-mss-login"

volumes:
  mss_login_data:
    name: mss_login_data
  comfyui_models:
    name: comfyui_models
  comfyui_output:
    name: comfyui_output
  comfyui_input:
    name: comfyui_input
  comfyui_user:
    name: comfyui_user
  comfyui_custom_nodes:
    name: comfyui_custom_nodes
