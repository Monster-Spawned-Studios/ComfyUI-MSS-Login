# Gitleaks config for MSS-Login CI.
# Allowlist known test fixtures (fake JWT / SQLCipher PRAGMA strings used only in unit tests).
title = "ComfyUI-MSS-Login"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures and intentional example secrets (not live credentials)"
paths = [
	'''tests/.*''',
	'''scripts/security-check\.sh''',
	'''\.gitleaks\.toml''',
]
