[project]
name = "ComfyUI-MSS-Login"
description = "A ComfyUI node to enhance the security of the overall ComfyUI experience, for both private and public-facing servers, adding more features, while still allowing ComfyUI to be usable."
version = "0.0.1"
license = {file = "readme/LICENSE.md"} 
