[project]
license = { file = "readme/LICENSE.md" }
name = "MSS-Login"
description = "A ComfyUI node to enhance the security of the overall ComfyUI experience, for both private and public-facing servers, adding more features, while still allowing ComfyUI to be usable."
version = "0.0.3"
requires-python = ">=3.13"
classifiers = [
	# For OS-independent nodes (works on all operating systems)
	"Operating System :: OS Independent",

	# GPU Accelerator support. Pick the ones that are supported by your extension.
	"Environment :: GPU :: NVIDIA CUDA", # NVIDIA CUDA support
	"Environment :: GPU :: AMD ROCm",    # AMD ROCm support (Can't test it currently... Support is planned and is being implemented)
	# "Environment :: GPU :: Intel Arc",      # Intel Arc support
	# "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
	"Environment :: GPU :: Apple Metal", # Apple Metal support
]
# dynamic = ["dependencies"]

dependencies = [
	"uv",
	"aiohttp",
	"PyJWT",
	"bcrypt",
	"bleach",
	"pyotp",
	"python-dotenvx>=0.3.0",
	"cryptography",
	"psycopg2-binary",
	"pymysql",
	"sqlcipher3",
	"argon2-cffi",
	"pillow",
	"numpy",
	"torch",
	"torchvision",
	"torchaudio",
	"transformers",
	"boto3",
	"comfyui-frontend-package>=1.40.0",
]

# ? FOR LATER TESTING:
# [tool.setuptools.dynamic]
# dependencies = {file = ["requirements.txt", "requirements_cuda.txt", "requirements_metal.txt"]}

# Local-only groups (PEP 735): not published. Use `uv sync --group comfyui` or `uv sync --group dev`.
[dependency-groups]
# Run/launch ComfyUI (e.g. `uv run --group comfyui comfy --workspace /path launch`). Separate from dev.
comfyui = ["comfy-cli"]
# Apple M-based computer dependencies are here:
m-deps = []
# CUDA computer/GPU dependencies are here:
cuda-deps = []
# Testing/development: add tools with `uv add --dev pytest` etc.
dev = ["pytest", "pip-audit", "ruff", "uv"]
# Production dependency group:
production = [
	"uv",
	"aiohttp",
	"PyJWT",
	"bcrypt",
	"bleach",
	"pyotp",
	"python-dotenvx>=0.3.0",
	"cryptography",
	"psycopg2-binary",
	"pymysql",
	"sqlcipher3",
	"argon2-cffi",
	"pillow",
	"numpy",
	"torch",
	"torchvision",
	"torchaudio",
	"transformers",
	"boto3",
]
# MKDocs documentation dependencies:
documentation = ["mkdocs", "mkdocs-material", "uv"]

[tool.uv]
default-groups = ["production", "documentation"]

# PyTorch with CUDA: PEP 621 does not define extra-index-url. For pip, use:
#   pip install --extra-index-url https://download.pytorch.org/whl/cu124 .
# (Use cu121, cu118, etc. for other CUDA versions; see https://download.pytorch.org/whl/)
# For uv: use CUDA wheels on Linux/Windows (e.g. Docker on NAS); on macOS (e.g. M1) use PyPI (CPU/Metal).
# See: https://docs.astral.sh/uv/guides/integration/pytorch/#configuring-accelerators-with-environment-markers

[tool.uv.sources]
torch = [
	{ index = "pytorch-cuda-128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
	{ index = 'pytorch-cpu', marker = "sys_platform == 'darwin'" },
]
torchvision = [
	{ index = "pytorch-cuda-128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
	{ index = 'pytorch-cpu', marker = "sys_platform == 'darwin'" },
]
torchaudio = [
	{ index = "pytorch-cuda-128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
	{ index = 'pytorch-cpu', marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cuda-128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda-130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Repository = "https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login/wiki"
"Bug Tracker" = "https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login/issues"

[tool.comfy]
PublisherId = "monsterspawnedstudios"
DisplayName = "MSS-Login"
Icon = "https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login/raw/production/web/assets/mss_logo.png"
includes = []
requires-comfyui = ">=0.10.0"                                                                                # ComfyUI version compatibility

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
	".git",
	".agent",
	".vscode",
	"users",
	"docs",
	"readme",
	".venv",
	"__pycache__",
	"build",
	"site",
	"ComfyUI",
]
# Lint: use defaults (E, F, W, I, UP, B, C4, etc.); ignore a few noisy rules.
[tool.ruff.lint]
extend-ignore = [
	"ARG001",  # Unused function argument (often required for callbacks/signatures)
	"PLR0913", # Too many arguments (noisy in route/handler code),
	"F401",    # Ignore unused variables, as we might use them later.
	"F841",    # Ignore unused variable, as we might use it later.
	"E402",    # Ignore imports being out of order. This is a trivial issue (might remove later).
]
# Isort: treat repo as single first-party; stdlib then third-party then local.
[tool.ruff.lint.isort]
known-first-party = ["utils", "utils.sfw_intercept", "routes"]
# --- Python 3 formatting (canonical; replaces a dedicated [*.py] EditorConfig block) ---
# Maps common EditorConfig keys for *.py:
#   end_of_line lf          -> line-ending (below)
#   indent_style tab        -> indent-style (below); one tab per indent level
#   indent_size 4           -> editor tab *display* width only (set in .editorconfig / IDE; not a Ruff key)
#   charset utf-8           -> not configurable in Ruff; save sources as UTF-8
#   trim_trailing_whitespace / insert_final_newline -> applied when you run `ruff format`
# Line width: [tool.ruff] line-length above (100).
# Target syntax: [tool.ruff] target-version (py313).
[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true
docstring-code-format = false
docstring-code-line-length = 150
exclude = [
	".git",
	".agent",
	".vscode",
	"users",
	"docs",
	"readme",
	".venv",
	"__pycache__",
	"build",
	"site",
	"ComfyUI",
]

# Pytest: for when running with full ComfyUI env. Prefer standalone runners for CI (see tests/README.md).
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "run_*.py"]
python_functions = ["test_*"]
markers = [
	"path_traversal: path traversal / path_safety tests (no ComfyUI deps).",
	"requires_comfyui: tests that need ComfyUI (folder_paths, server) installed.",
]
addopts = "-v --tb=short"
