[project]
name = "ComfyUI-MSS-Login"
description = "A ComfyUI node to enhance the security of the overall ComfyUI experience, for both private and public-facing servers, adding more features, while still allowing ComfyUI to be usable."
version = "0.0.1"
license = {file = "readme/LICENSE.md"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["aiohttp", "PyJWT", "bcrypt", "bleach", "pyotp", "python-dotenvx", "cryptography", "psycopg2-binary", "argon2-cffi", "pillow", "numpy", "torch"]

[project.urls]
Repository = "https://gitlab.monsterspawned.studio/Monster-Spawned-Studios/ComfyUI-MSS-Login"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://gitlab.monsterspawned.studio/Monster-Spawned-Studios/ComfyUI-MSS-Login/-/wiki"
"Bug Tracker" = "https://gitlab.monsterspawned.studio/Monster-Spawned-Studios/ComfyUI-MSS-Login/-/issues"

[tool.comfy]
PublisherId = "Monster Spawned Studios"
DisplayName = "ComfyUI-MSS-Login"
Icon = "https://gitlab.monsterspawned.studio/Monster-Spawned-Studios/ComfyUI-MSS-Login/-/raw/development/web/assets/mss_logo.png"
includes = [] 
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "site",
]
# Lint: use defaults (E, F, W, I, UP, B, C4, etc.); ignore a few noisy rules.
[tool.ruff.lint]
extend-ignore = [
    "ARG001",   # Unused function argument (often required for callbacks/signatures)
    "PLR0913",  # Too many arguments (noisy in route/handler code),
    "F401"      # Ignore unused variables, as we might use them later.
]
# Isort: treat repo as single first-party; stdlib then third-party then local.
[tool.ruff.lint.isort]
known-first-party = ["utils", "routes"]
# Format: match EditorConfig and common Python style (4 spaces, LF).
[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"
