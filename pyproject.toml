dependencies = ["aiohttp", "PyJWT", "bcrypt", "bleach", "pyotp", "python-dotenvx", "cryptography", "psycopg2-binary"]

[project.urls]
Repository = "https://gitlab.monsterspawned.studio/Monster-Spawned-Studios/ComfyUI-MSS-Login"
#  Used by Comfy Registry https://registry.comfy.org
